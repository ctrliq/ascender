# Podman inside the task container (the old application's
# tools/docker-compose/containers.conf). Execution environment containers
# share the task container's namespaces, so they need no network or user
# namespace setup of their own and see what it sees; cgroups are left to the
# outer runtime.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"
