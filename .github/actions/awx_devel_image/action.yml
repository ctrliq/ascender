name: Setup images for Ascender
description: Builds new ascender_devel image
inputs:
  github-token:
    description: GitHub Token for registry access
    required: true
runs:
  using: composite
  steps:
    - name: Set lower case owner name
      shell: bash
      run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Install ansible-core for generating Dockerfile.dev
      shell: bash
      # Constrained to the tested minor series so new upstream releases can't
      # change CI behavior mid-flight; bump deliberately after validating.
      run: python3 -m pip install --upgrade 'ansible-core~=2.21.0'

    - name: Log in to registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Pre-pull latest devel image to warm cache
      shell: bash
      run: |
        # Best effort: the devel image may not exist yet for this owner.
        # docker-compose-build uses ascender_devel:$COMPOSE_TAG as its cache
        # source, so retag whatever we pulled to match.
        if docker pull -q ghcr.io/${OWNER_LC}/ascender_devel:latest; then
          docker tag ghcr.io/${OWNER_LC}/ascender_devel:latest ghcr.io/${OWNER_LC}/ascender_devel:${COMPOSE_TAG}
        fi
      env:
        COMPOSE_TAG: ${{ github.base_ref || 'main' }}

    - name: Build image for current source checkout
      shell: bash
      run: |
        DEV_DOCKER_TAG_BASE=ghcr.io/${OWNER_LC} \
        COMPOSE_TAG=${{ github.base_ref || 'main' }} \
        make docker-compose-build
