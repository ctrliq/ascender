name: Setup images for Ascender
description: Builds new ascender_devel image
inputs:
  github-token:
    description: GitHub Token for registry access
    required: true
runs:
  using: composite
  steps:
    - name: Set lower case owner name
      shell: bash
      run: echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
      env:
        OWNER: '${{ github.repository_owner }}'

    - name: Install ansible-core for generating Dockerfile.dev
      shell: bash
      # Constrained to the tested minor series so new upstream releases can't
      # change CI behavior mid-flight; bump deliberately after validating.
      run: python3 -m pip install --upgrade 'ansible-core~=2.21.0'

    - name: Log in to registry
      shell: bash
      run: |
        echo "${{ inputs.github-token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

    - name: Expose GitHub Actions runtime for the buildx gha cache backend
      uses: crazy-max/ghaction-github-runtime@3cb05d89e1f492524af3d41a1c98c83bc3025124  # v3.1.0

    # NOTE: the cache lives in the GitHub Actions cache (type=gha), NOT in the
    # ghcr.io ascender_devel images. Those are intentionally production-style
    # builds (for testing in kubernetes-like environments) rendered from a
    # different Dockerfile — they provide no usable layer cache for this
    # dev-mode build, and must never be retagged as the dev image: without
    # podman the dev environment starts but cannot run jobs.
    # PR runs restore cache written by pushes to main (seed_ci_image_cache.yml)
    # and by earlier runs of the same PR.
    - name: Build image for current source checkout
      shell: bash
      run: |
        make Dockerfile.dev
        docker buildx build \
          --load \
          --cache-from type=gha,scope=${{ github.repository }}-devel-ci \
          --cache-to "type=gha,scope=${{ github.repository }}-devel-ci,mode=max" \
          -t ghcr.io/${OWNER_LC}/ascender_devel:${COMPOSE_TAG} \
          -f Dockerfile.dev .
      env:
        COMPOSE_TAG: ${{ github.base_ref || 'main' }}

    - name: Verify the built image has the dev-mode pieces
      shell: bash
      # Guards against a non-dev image sneaking in under the devel tag (e.g. a
      # bad cache pre-pull surviving a skipped build) — without podman the dev
      # environment starts fine but cannot run any jobs, which is much harder
      # to diagnose downstream.
      run: |
        docker run --rm ghcr.io/${OWNER_LC}/ascender_devel:${COMPOSE_TAG} which podman
      env:
        COMPOSE_TAG: ${{ github.base_ref || 'main' }}
