name: Run Ascender docker-compose
description: Runs the Ascender development environment with `make docker-compose`
inputs:
  github-token:
    description: GitHub Token to pass to awx_devel_image
    required: true
  build-ui:
    description: Should the UI be built?
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Build ascender_devel image for the development environment
      uses: ./.github/actions/awx_devel_image
      with:
        github-token: ${{ inputs.github-token }}

    - name: Upgrade ansible-core
      shell: bash
      run: python3 -m pip install --upgrade ansible-core

    - name: Install system deps
      shell: bash
      run: sudo apt-get install -y gettext

    - name: Start the development environment
      shell: bash
      run: |
        DEV_DOCKER_OWNER=${{ github.repository_owner }} \
        COMPOSE_TAG=${{ github.base_ref || 'main' }} \
        COMPOSE_UP_OPTS="-d" \
        make docker-compose

    - name: Wait for the development environment and set the admin password
      shell: bash
      run: |
        SECONDS=0
        while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' -k https://localhost:8043/api/v2/ping/)" != "200" ]]; do
          if [[ $SECONDS -gt 600 ]]; then
            echo "Timing out, the API never came up"
            docker ps -a
            docker logs tools_awx_1 || true
            exit 1
          fi
          echo "Waiting for the API..."
          sleep 5
        done
        echo "The API is up, updating the password..."
        docker exec -i tools_awx_1 sh <<-EOSH
          awx-manage update_password --username=admin --password=password
        EOSH

    - name: Build UI
      # This must be a string comparison in composite actions:
      # https://github.com/actions/runner/issues/2238
      if: ${{ inputs.build-ui == 'true' }}
      shell: bash
      run: |
        docker exec -i tools_awx_1 sh <<-EOSH
          make ui-devel
        EOSH
