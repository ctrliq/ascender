---
# Every uses: in the workflows and every base image is pinned (a commit SHA
# or a digest, the version beside it); Dependabot bumps both together. Go
# modules get version updates too.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - build

  # Go modules: version updates as well as the security updates GitHub
  # sends anyway. make licenses (CI's licenses check) must be rerun on the
  # pull request.
  - package-ecosystem: gomod
    directory: /src
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"

  # The images' base images are pinned by digest (tag@sha256); this moves
  # the digest when the tag moves, so security updates of the base reach
  # the images.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - build

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
