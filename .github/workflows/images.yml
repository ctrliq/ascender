---
# Builds and pushes the two images, ascender-web and ascender-task, under
# one registry path. devel_images.yml and release.yml call this; it does not
# run by itself.
#
# The Go binaries are cross-compiled on the runner (the Dockerfiles build
# them on $BUILDPLATFORM), so an arm64 image runs only its dnf installs
# under QEMU.
name: Build Images

on:
  workflow_call:
    inputs:
      image-path:
        description: Registry path the images go under (ghcr.io/ctrliq/ascender), without the image name
        required: true
        type: string
      tags:
        description: docker/metadata-action tag rules, one per line
        required: true
        type: string
      version:
        description: ASCENDER_VERSION baked into the images
        required: true
        type: string
      platforms:
        description: Platforms to build, comma-separated
        required: false
        type: string
        default: linux/amd64
      ref:
        description: Git ref to build (default the triggering ref)
        required: false
        type: string
        default: ''
      cache-scope:
        description: GitHub Actions cache scope prefix the build writes to
        required: true
        type: string
      sign:
        description: Sign the pushed images with cosign and attest their build provenance
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ascender-${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # cosign and attest-build-provenance sign through Sigstore with the
      # workflow's own OIDC identity, so there is no key to hold or rotate
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, task]
    steps:
      # Registry paths must be lower case; an owner name may not be.
      - name: Image name
        id: image
        env:
          IMAGE: ${{ inputs.image-path }}/ascender-${{ matrix.component }}
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU for multi-arch builds
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.title=ascender-${{ matrix.component }}
            org.opencontainers.image.version=${{ inputs.version }}
          flavor: latest=false

      # Pull request CI (ci.yml) builds these images too, reading the cache
      # this writes on every push to main.
      - name: Build and push ascender-${{ matrix.component }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          platforms: ${{ inputs.platforms }}
          build-args: ASCENDER_VERSION=${{ inputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # A signed (release) build starts from nothing: a cached
          # "dnf update" layer would ship last month's packages.
          no-cache: ${{ inputs.sign }}
          cache-from: |
            type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.component }}
            type=gha,scope=ascender-devel-${{ matrix.component }}
          cache-to: type=gha,scope=${{ inputs.cache-scope }}-${{ matrix.component }},mode=max

      - name: Install cosign
        if: inputs.sign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # Signs the digest, not the tag, so moving :latest later cannot change
      # what was signed. Verify with:
      #   cosign verify ghcr.io/ctrliq/ascender/ascender-web@<digest> \
      #     --certificate-identity-regexp '^https://github.com/ctrliq/ascender/' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign the image
        if: inputs.sign
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Verify with: gh attestation verify oci://<image>:<tag> --repo ctrliq/ascender
      - name: Attest build provenance
        if: inputs.sign
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          COMPONENT: ${{ matrix.component }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ascender-${COMPONENT}"
            echo
            echo "Version \`${VERSION}\`, platforms \`${PLATFORMS}\`, digest \`${DIGEST}\`"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
