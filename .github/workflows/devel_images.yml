---
# Every merge to main publishes development images:
#   ghcr.io/ctrliq/ascender-devel/ascender-web:{main,latest,sha-<commit>}
#   ghcr.io/ctrliq/ascender-devel/ascender-task:{main,latest,sha-<commit>}
# Their layer cache is what pull request CI builds from.
name: Build/Push Development Images

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer merge supersedes an image still building; main's tags should end
# on the newest commit, not on whichever build finished last.
concurrency:
  group: devel-images
  cancel-in-progress: true

jobs:
  version:
    # A manual run from another branch would publish it as main and latest
    # (and into the cache pull requests build from); the images job needs
    # this one, so both stop here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # As the old devel images were versioned: YYYY.M.D+git<commit>
      - name: Development version
        id: version
        run: echo "version=$(date -u +%Y.%-m.%-d)+git${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-path: ghcr.io/${{ github.repository }}-devel
      version: ${{ needs.version.outputs.version }}
      platforms: linux/amd64
      cache-scope: ascender-devel
      tags: |
        type=raw,value=main
        type=raw,value=latest
        type=sha,format=short
