name: CI
env:
  LC_ALL: "C.UTF-8" # prevent ERROR: Ansible could not initialize the preferred locale: unsupported locale setting
  CI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DEV_DOCKER_OWNER: ${{ github.repository_owner }}
  COMPOSE_TAG: ${{ github.base_ref || 'main' }}
on:
  pull_request:
jobs:
  common-tests:
    name: ${{ matrix.tests.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: read
      contents: read
    # The API suite runs on PostgreSQL, which is what Ascender is deployed
    # against; it used to run on SQLite, which left the partitioned event
    # tables, the COPY that assembles job stdout and every query-count
    # assertion untested. The service is shared by the whole matrix, which
    # costs nothing for the jobs that do not open a connection.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: awx
          POSTGRES_PASSWORD: awxpass
          POSTGRES_DB: awx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        tests:
          - name: api-test
            command: /start_tests.sh
          - name: api-migrations
            command: /start_tests.sh test_migrations
          - name: api-lint
            command: /var/lib/awx/venv/awx/bin/tox -e linters
          # Advisory while the diagnostics that are already in the tree are worked
          # through: the job reports them, it does not fail the pull request.
          - name: api-type-check
            command: /var/lib/awx/venv/awx/bin/tox -e typecheck
            advisory: true
          - name: ui-lint
            command: make ui-lint
          - name: ui-test-screens
            command: make ui-test-screens
          - name: ui-test-general
            command: make ui-test-general
    steps:
      - name: Checkout ascender
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build ascender_devel image for running checks
        uses: ./.github/actions/awx_devel_image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run check ${{ matrix.tests.name }}
        continue-on-error: ${{ matrix.tests.advisory || false }}
        # Host networking so the throwaway container reaches the service that
        # the runner published on localhost.
        env:
          DOCKER_RUNNER_OPTS: >-
            --network host
            -e AWX_TEST_DATABASE_HOST=127.0.0.1
            -e AWX_TEST_DATABASE_PORT=5432
            -e AWX_TEST_DATABASE_NAME=awx
            -e AWX_TEST_DATABASE_USER=awx
            -e AWX_TEST_DATABASE_PASSWORD=awxpass
        run: AWX_DOCKER_CMD='${{ matrix.tests.command }}' make docker-runner

  dev-env:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout ascender
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Start the development environment
        uses: ./.github/actions/run_awx_devel
        with:
          build-ui: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the ctrliq.ascender collection for the smoke test
        run: ansible-galaxy collection install ctrliq.ascender

      - name: Run smoke test
        run: ansible-playbook tools/docker-compose/ansible/smoke-test.yml -v

      - name: Get logs from the development environment on failure
        if: failure()
        run: docker logs tools_awx_1 || true

  e2e:
    name: ui-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout ascender
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # build-ui, unlike the dev-env job, because these tests drive the built UI
      # the way a user meets it rather than a development server
      - name: Start the development environment with the UI built
        uses: ./.github/actions/run_awx_devel
        with:
          build-ui: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The UI is built after the web process is already serving, and Django
      # caches the index template that names the bundle. Without this the tests
      # run against whatever was in the image, not against this pull request.
      - name: Serve the UI that was just built
        run: |
          docker exec tools_awx_1 \
            supervisorctl -c /etc/supervisord.conf restart tower-processes:awx-uwsgi
          SECONDS=0
          while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' -k https://localhost:8043/api/v2/ping/)" != "200" ]]; do
            if [[ $SECONDS -gt 180 ]]; then echo "the API did not come back after the restart"; exit 1; fi
            sleep 5
          done

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      - name: Install the end-to-end dependencies
        working-directory: awx/ui/e2e
        run: npm ci

      - name: Install the browser
        working-directory: awx/ui/e2e
        run: npx playwright install --with-deps chromium

      # run_awx_devel sets the admin password to this
      - name: Run the end-to-end tests
        working-directory: awx/ui/e2e
        env:
          ASCENDER_URL: https://localhost:8043
          ASCENDER_USERNAME: admin
          ASCENDER_PASSWORD: password
        run: npm test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: |
            awx/ui/e2e/playwright-report
            awx/ui/e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: Get logs from the development environment on failure
        if: failure()
        run: docker logs tools_awx_1 || true
