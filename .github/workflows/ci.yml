---
# Pull request checks. Each job runs what a developer runs locally (make
# help lists the targets), so a failure here reproduces with the same
# command.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, tidy, build, vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: gofmt
        run: make fmt-check

      - name: go mod tidy
        run: make tidy-check

      # The images ship licenses/go, one license per module linked into the
      # binaries; a dependency change must regenerate it (make licenses).
      - name: Go module licenses
        run: make licenses-check

      - name: Build
        run: make build

      - name: go vet
        run: make vet

      - name: Documentation site links
        run: make docsite-check

  lint:
    name: staticcheck, deadcode
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Lint
        run: make lint

  test:
    name: go test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The database-backed tests run against an empty database the web
    # binary gives the schema (the baseline and the Go migrations), the
    # PostgreSQL the compose file runs. They connect as the admin role:
    # the tests that need a database of their own (the multi-replica claim
    # tests, the API scratch tests) create and drop one, and skip without
    # CREATEDB.
    services:
      postgres:
        image: quay.io/sclorg/postgresql-18-c9s:latest@sha256:1732d0a342e2790afc100e1fe741704e5c4413dfba9a3ab3b571c26b8cb0da6f
        env:
          POSTGRESQL_USER: ascender
          POSTGRESQL_PASSWORD: ci
          POSTGRESQL_DATABASE: ascender
          POSTGRESQL_ADMIN_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ASCENDER_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ascender?sslmode=disable
      ASCENDER_SCRATCH_DATABASE_URL: postgres://postgres:ci@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Load the schema
        working-directory: src
        env:
          ASCENDER_DATABASE_URL: ${{ env.ASCENDER_TEST_DATABASE_URL }}
          ASCENDER_SECRET_KEY: ci-only-secret-key
        run: go run ./cmd/ascender-web migrate

      # The tests that need the LDAP rig (ASCENDER_TEST_LDAP_URI) skip
      # without it.
      - name: Test
        run: make test GOTESTFLAGS='-race -count=1'

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational until the toolchain moves past GO-2026-6859 (Go
    # 1.27.4); then drop continue-on-error so a reachable advisory fails.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: govulncheck
        run: make vulncheck

  images:
    name: image ascender-${{ matrix.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [web, task]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Builds without pushing, from the cache devel_images.yml writes on
      # main, so a broken Dockerfile shows up before the merge.
      - name: Build ascender-${{ matrix.component }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ascender-${{ matrix.component }}:ci
          cache-from: type=gha,scope=ascender-devel-${{ matrix.component }}

      - name: Smoke test the image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          docker run --rm --entrypoint test "ascender-$COMPONENT:ci" -x "/usr/bin/ascender-$COMPONENT"
          # Templates render in a child process of the binary itself.
          out="$(echo '{"template": "{{ x | upper }}", "vars": {"x": "ok"}}' |
            docker run --rm -i --entrypoint "/usr/bin/ascender-$COMPONENT" "ascender-$COMPONENT:ci" __jinja-run context)"
          test "$out" = '{"ok":"OK"}' || { echo "template render: $out"; exit 1; }
          if [ "$COMPONENT" = web ]; then
            docker run --rm --entrypoint test "ascender-web:ci" -f /usr/share/ascender/docs/index.md
          fi
          if [ "$COMPONENT" = task ]; then
            docker run --rm --entrypoint sh "ascender-task:ci" -c 'podman --version && ! command -v git'
          fi
