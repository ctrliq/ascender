---
name: Bug report
description: "🐞 Report a bug in Ascender"
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Bug reports are for **concrete, reproducible bugs** in Ascender only.
        Questions go to [Discussions](https://github.com/ctrliq/ascender/discussions),
        and security vulnerabilities to security@ciq.com, never to a public issue
        (see [SECURITY.md](https://github.com/ctrliq/ascender/blob/main/SECURITY.md)).

  - type: checkboxes
    id: terms
    attributes:
      label: Please confirm the following
      options:
        - label: I have checked the [current issues](https://github.com/ctrliq/ascender/issues) for duplicates.
          required: true
        - label: I understand that Ascender is open source software provided for free and that I might not receive a timely response.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Bug summary
      description: Briefly describe the problem.
    validations:
      required: true

  - type: input
    id: ascender-version
    attributes:
      label: Ascender version
      description: The version the UI's About box shows (the question mark menu at the top of the page), or `GET /api/v2/ping/` returns.
    validations:
      required: true

  - type: checkboxes
    id: components
    attributes:
      label: Select the relevant components
      description: >-
        Problems with the installer, the operator or the Ansible collection belong in
        [ascender-install](https://github.com/ctrliq/ascender-install/issues),
        [ascender-operator](https://github.com/ctrliq/ascender-operator/issues) or
        [ascender-collection](https://github.com/ctrliq/ascender-collection/issues).
      options:
        - label: UI
        - label: API
        - label: Jobs and the task runner
        - label: Docs
        - label: Other

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      description: How did you install Ascender?
      multiple: false
      options:
        - Ascender installer, K3s
        - Ascender installer, RKE2
        - Ascender installer, EKS, GKE or AKS
        - Ascender installer, OpenShift, DKP or TKGI
        - Ascender installer, offline
        - Ascender operator on my own cluster
        - Docker Compose (deploy/)
        - Other
    validations:
      required: true

  - type: dropdown
    id: modified-architecture
    attributes:
      label: Modifications
      description: >-
        Have you modified the installation, deployment topology or container images in any way? If yes,
        explain in "Additional information" at the bottom of the form.
      multiple: false
      options:
        - "no"
        - "yes"
    validations:
      required: true

  - type: input
    id: execution-environment
    attributes:
      label: Execution environment
      description: For job problems, the execution environment image the job ran in.
    validations:
      required: false

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: The operating system of the hosts Ascender runs on.
    validations:
      required: false

  - type: dropdown
    id: browsers
    attributes:
      label: Web browser
      description: For UI problems, which browsers are affected?
      multiple: true
      options:
        - Firefox
        - Chrome
        - Safari
        - Edge

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Starting from a new installation, describe exactly how a developer can reproduce the bug on
        infrastructure that isn't yours. Include the resources created, input values, users, roles
        assigned, playbooks used and so on.
    validations:
      required: true

  - type: textarea
    id: expected-results
    attributes:
      label: Expected results
      description: What did you expect to happen when running the steps above?
    validations:
      required: true

  - type: textarea
    id: actual-results
    attributes:
      label: Actual results
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: >-
        Relevant log output (from the ascender-web and ascender-task containers), screenshots or anything
        else that helps. Remove passwords, tokens and other secrets first.
    validations:
      required: false
