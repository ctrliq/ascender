---
name: Feature request
description: "✨ Suggest an idea for Ascender"
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are for **new features or enhancements** to Ascender only.
        To talk an idea over first, start a [discussion](https://github.com/ctrliq/ascender/discussions).

  - type: checkboxes
    id: terms
    attributes:
      label: Please confirm the following
      options:
        - label: I have checked the [current issues](https://github.com/ctrliq/ascender/issues) for duplicates.
          required: true
        - label: I understand that Ascender is open source software provided for free and that I might not receive a timely response.
          required: true

  - type: dropdown
    id: feature-type
    attributes:
      label: Feature type
      description: What kind of feature is this?
      multiple: false
      options:
        - New feature
        - Enhancement to an existing feature
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Feature summary
      description: Briefly describe the feature or enhancement.
    validations:
      required: true

  - type: checkboxes
    id: components
    attributes:
      label: Select the relevant components
      description: >-
        Requests for the installer, the operator or the Ansible collection belong in
        [ascender-install](https://github.com/ctrliq/ascender-install/issues),
        [ascender-operator](https://github.com/ctrliq/ascender-operator/issues) or
        [ascender-collection](https://github.com/ctrliq/ascender-collection/issues).
      options:
        - label: UI
        - label: API
        - label: Jobs and the task runner
        - label: Docs
        - label: Other

  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: >-
        The steps or situation that show what you are asking for: what you are trying to do, and
        everything a developer needs to understand it.
    validations:
      required: true

  - type: textarea
    id: current-results
    attributes:
      label: Current results
      description: What happens in that scenario today?
    validations:
      required: true

  - type: textarea
    id: suggested-results
    attributes:
      label: Suggested result
      description: What would the new feature let you do?
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Anything else that helps us understand the request.
    validations:
      required: false
