<!--
  Modifications Copyright (c) 2023 Ctrl IQ, Inc.

  The built file is plain HTML, with no Django template syntax in it at all.
  vite.config.mjs injects the content security policy and one style rule at the
  two comment markers below, because the dev server serves this file as it
  stands and its policy is not the built one.
-->
<!doctype html>
<html lang="en">
  <head>
    <!--django-head-->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="CIQ Ascender" />
    <!-- A document needs a title before any script runs: the login screen sets the
         branded one once its configuration arrives, and until then this is what a
         screen reader and the browser tab have to work with. -->
    <title>Ascender</title>
    <link rel="shortcut icon" href="/static/media/favicon.ico" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--django-body-->
    <div id="app" style="height: 100%"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
