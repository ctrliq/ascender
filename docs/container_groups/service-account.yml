#
# A service account for a container group's "OpenShift or Kubernetes API
# Bearer Token" credential, with the role Ascender needs in the namespace the
# job pods run in. Replace containergroup-namespace with that namespace (and
# set the same namespace in the group's pod_spec_override).
#
# Create the service account, role, role binding and token:
#
#   kubectl -n containergroup-namespace apply -f service-account.yml
#
# Read the API token and the CA certificate for the credential:
#
#   kubectl -n containergroup-namespace get secret containergroup-service-account-token -o jsonpath='{.data.token}' | base64 -d
#   kubectl -n containergroup-namespace get secret containergroup-service-account-token -o jsonpath='{.data.ca\.crt}' | base64 -d
#
# The secrets rule is needed only when an execution environment has a
# registry credential: Ascender then creates an image pull secret in the
# namespace.
#

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: containergroup-service-account
  namespace: containergroup-namespace
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: containergroup-service-account-token
  namespace: containergroup-namespace
  annotations:
    kubernetes.io/service-account.name: containergroup-service-account
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: role-containergroup-service-account
  namespace: containergroup-namespace
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: role-containergroup-service-account-binding
  namespace: containergroup-namespace
subjects:
  - kind: ServiceAccount
    name: containergroup-service-account
    namespace: containergroup-namespace
roleRef:
  kind: Role
  name: role-containergroup-service-account
  apiGroup: rbac.authorization.k8s.io
