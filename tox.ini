[tox]
isolated_build = True

[testenv:linters]
# Linter versions are pinned so results don't drift as new releases land;
# bump deliberately and re-run `tox -e linters` (make format) when upgrading.
deps =
  ruff==0.16.6
  yamllint==1.38.0
commands =
  # Formatting and linting both come from ruff. Its config lives in
  # pyproject.toml under [tool.ruff], and the rule selection there is the one
  # ported from the [flake8] block this replaces, all 48 of them.
  ruff format --check awx
  ruff check awx
  yamllint -s .

[testenv:typecheck]
# Advisory: the type checker runs over awx/ on every pull request and reports what
# it finds without failing the merge, so the diagnostics that are already there can
# be worked through a module at a time. It resolves third-party imports out of the
# environment awx is installed in, which is the venv baked into the development
# image; set TYPECHECK_PYTHON to run it against another one. Pinned like the other
# linters so results do not drift as new releases land.
deps =
  ty==0.0.74
passenv =
  TYPECHECK_PYTHON
commands =
  ty check awx --python {env:TYPECHECK_PYTHON:/var/lib/awx/venv/awx}

[testenv:typecheck-strict]
# The ratchet. typecheck above reports on the whole tree without failing, which
# is how the backlog gets worked through; this one fails, over the packages that
# are already clean, so they cannot quietly regress. Move a package up here the
# moment it reports nothing, and the advisory run keeps covering the rest.
deps =
  {[testenv:typecheck]deps}
passenv =
  TYPECHECK_PYTHON
commands =
  ty check \
    awx/api/management \
    awx/conf/management \
    awx/conf/migrations \
    awx/dab/jwt_consumer/awx \
    awx/dab/jwt_consumer/migrations \
    awx/dab/lib/channels \
    awx/dab/lib/middleware \
    awx/dab/resource_registry/management \
    awx/dab/resource_registry/migrations \
    awx/dab/rest_filters \
    awx/main/templatetags \
    awx/sso/migrations \
    --python {env:TYPECHECK_PYTHON:/var/lib/awx/venv/awx}

[testenv:pip-compile-docs]
description = Compile docs build lockfiles
deps =
  uv
commands =
  {envpython} -m uv pip compile \
    --output-file=docs/docsite/requirements.txt \
    docs/docsite/requirements.in \
    {posargs:--upgrade}

[testenv:docs]
description = Build documentation
deps =
  -r{toxinidir}/docs/docsite/requirements.in
  -c{toxinidir}/docs/docsite/requirements.txt
commands =
  python {toxinidir}/docs/docsite/rst/rest_api/_swagger/download-json.py
  sphinx-build -T -E -W -n --keep-going {tty:--color} -j auto -c docs/docsite -d docs/docsite/build/doctrees -b html docs/docsite/rst docs/docsite/build/html
