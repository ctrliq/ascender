---
- name: Build AWX Docker Images
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Get version from SCM if not explicitly provided
      command: make version-for-buildyml
      args:
        chdir: '../../'
      register: scm_version
      failed_when: not scm_version.stdout
      when: ascender_version is not defined

    - name: Set ascender_version
      set_fact:
        ascender_version: "{{ scm_version.stdout }}"
      when: ascender_version is not defined

    - name: Set ascender_docker_version with + replaced by _
      set_fact:
        ascender_docker_version: "{{ ascender_version | replace('+', '_') }}"

    - include_role:
        name: dockerfile
    - include_role:
        name: image_build
