$WorkDirectory /var/lib/ascender/rsyslog
$MaxMessageSize 700000
$IncludeConfig /var/lib/ascender/rsyslog/conf.d/*.conf
module(load="imuxsock" SysSock.Use="off")
input(type="imuxsock" Socket="/var/run/ascender-rsyslog/rsyslog.sock" unlink="on")
template(name="awx" type="string" string="%msg%")
action(type="omfile" file="/dev/null")
